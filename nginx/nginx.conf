# 宮今 Nginx: CloudFront → (EC2:80) → 이 Nginx → 컨테이너
#   /api/*  → api (FastAPI)
#   /ws/*   → realtime (실시간 통역 WebSocket)
# 하는 일: 경로별 라우팅 + LLM 비용 보호용 IP 별 속도 제한 + 에러를 {"error": "..."} 모양으로 통일

worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # 관람객 IP 찾기 (요청 제한의 기준). 앞단 프록시 뒤에서는 $remote_addr 가 프록시 주소라 관람객 구분이 안 됨.
    #   1) CloudFront (AWS 배포): 오리진 요청 정책에 넣은 CloudFront-Viewer-Address = "관람객IP:포트" → 포트를 뗌
    #   2) Cloudflare Tunnel (온프레미스 개발 서버): Cloudflare 가 붙이는 CF-Connecting-IP
    #   3) 둘 다 없으면 (로컬 개발) $remote_addr
    # X-Forwarded-For 는 관람객이 앞부분을 꾸며 보낼 수 있어서 쓰지 않음. 위 두 헤더도 이 Nginx 가 앞단 프록시를 거쳐서만
    # 닿을 때만 믿을 수 있으므로, 터널을 쓸 때는 HTTP_BIND=127.0.0.1 (밖에서 직접 못 들어오게) 로 띄움.
    map $http_cf_connecting_ip $edge_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }
    map $http_cloudfront_viewer_address $client_ip {
        "~^(?<ip>.+):\d+$" $ip;
        default            $edge_ip;
    }

    # LLM 을 부르는 /api/ask · /api/course: IP 당 분당 10회 (deploy/API.md), 순간 5회까지 허용
    limit_req_zone $client_ip zone=llm:10m rate=10r/m;
    # 세션 만들기: 음성 인식·번역 비용이 드는 세션을 마구 만들지 못하게 IP 당 분당 5회
    limit_req_zone $client_ip zone=session:10m rate=5r/m;
    # 방문 집계: 정상 관람객은 몇 분에 한 번 → IP 당 분당 30회
    limit_req_zone $client_ip zone=stats:10m rate=30r/m;
    # 관리자 API: 토큰을 모르는 쪽의 무작위 시도를 늦춤
    limit_req_zone $client_ip zone=admin:10m rate=30r/m;
    limit_req_status 429;

    # 컨테이너를 다시 만들면 IP 가 바뀜 → Docker DNS 로 다시 찾음 (안 하면 배포 뒤 Nginx 를 재시작할 때까지 503)
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream api      { zone api 64k;      server api:8000 resolve; }
    upstream realtime { zone realtime 64k; server realtime:8001 resolve; }

    server {
        listen 80;
        client_max_body_size 16k;  # 질문·요청은 300자

        location = /api/ask    { limit_req zone=llm burst=5 nodelay; proxy_pass http://api; include /etc/nginx/proxy.conf; }
        location = /api/course { limit_req zone=llm burst=5 nodelay; proxy_pass http://api; include /etc/nginx/proxy.conf; }
        location = /api/sessions     { limit_req zone=session burst=3 nodelay; proxy_pass http://api; include /etc/nginx/proxy.conf; }
        location = /api/stats/visits { limit_req zone=stats burst=10 nodelay;  proxy_pass http://api; include /etc/nginx/proxy.conf; }
        location /api/admin/   { limit_req zone=admin burst=10 nodelay; proxy_pass http://api; include /etc/nginx/proxy.conf; }
        location /api/         {                                       proxy_pass http://api; include /etc/nginx/proxy.conf; }

        # 실시간 통역. 해설 2시간 → 타임아웃 3시간 + 앱이 30초마다 ping (CloudFront·Nginx 유휴 끊김 방지)
        location /ws/ {
            proxy_pass http://realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_read_timeout 3h;
            proxy_send_timeout 3h;
            client_max_body_size 1m;   # 오디오 프레임
        }

        location / { default_type application/json; return 404 '{"error": "없는 경로"}'; }

        error_page 429 = @too_many;
        error_page 502 503 = @unavailable;
        error_page 504 = @timeout;
        location @too_many    { default_type application/json; return 429 '{"error": "요청이 너무 많습니다. 잠시 후 다시 시도하세요"}'; }
        location @unavailable { default_type application/json; return 503 '{"error": "서버를 준비 중입니다"}'; }
        location @timeout     { default_type application/json; return 504 '{"error": "답변이 너무 오래 걸립니다"}'; }
    }
}
