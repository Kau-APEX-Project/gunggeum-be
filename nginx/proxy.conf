# /api 공통 프록시 설정
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $client_ip;
proxy_set_header X-Forwarded-For $client_ip;
proxy_set_header X-Forwarded-Proto https;   # 관람객 ↔ CloudFront 구간은 HTTPS
proxy_connect_timeout 5s;
proxy_read_timeout 60s;   # deploy/API.md: 서버 타임아웃 60초 (코스 10~20초)
proxy_intercept_errors on; # 502·504 를 위 JSON 에러로 바꿈 (api 가 직접 낸 4xx·5xx JSON 은 그대로)
