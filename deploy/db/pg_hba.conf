# 기본 DB(앱 서버 db 컨테이너) 접속 규칙. docker-compose.aws.yml 이 hba_file 로 지정.
# 이미지 기본값(컨테이너 안 local·127.0.0.1 은 trust, 나머지는 비밀번호) + 대기 DB 복제 한 줄.
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
# 대기 DB(EC2, VPC 10.0.0.0/16 안)의 스트리밍 복제. 사용자 replicator 만, 비밀번호 필요
host    replication     replicator      10.0.0.0/16             scram-sha-256
# api·realtime 컨테이너(도커 네트워크)와 그 밖의 접속은 비밀번호
host    all             all             all                     scram-sha-256
